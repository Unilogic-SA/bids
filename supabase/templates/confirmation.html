<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Confirm your email address</title>

<body style="margin:0;padding:0;width:100%;background-color:#ffffff;color:#171717;font-family:Inter,Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border-collapse:collapse;">
<tr><td align="center" style="padding:40px 16px;">

<tr><td style="padding:0 8px 40px;font-family:Figtree,Inter,Arial,sans-serif;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.4px;color:#171717;">OpenBids</td></tr>
<tr><td style="padding:0 8px;">
<h1 style="margin:0 0 20px;font-family:Figtree,Inter,Arial,sans-serif;font-size:28px;line-height:1.25;font-weight:600;letter-spacing:-0.5px;">Confirm your email address</h1>
<p style="margin:0 0 20px;color:#404040;font-size:16px;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;">Confirm your email address to finish setting up your OpenBids account.</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 28px;border-collapse:separate;">
<tr><td bgcolor="#6d28d9" style="background-color:#6d28d9;border-radius:7px;text-align:center;mso-padding-alt:14px 24px;">
<a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}" style="display:inline-block;border:1px solid #6d28d9;border-radius:7px;padding:13px 23px;font-size:16px;line-height:22px;font-weight:600;color:#ffffff;text-decoration:none;mso-padding-alt:0;"><!--[if mso]><i style="mso-font-width:150%;mso-text-raise:21pt;" hidden>&emsp;</i><![endif]--><span style="mso-text-raise:10pt;">Confirm email</span><!--[if mso]><i style="mso-font-width:150%;" hidden>&emsp;&#8203;</i><![endif]--></a>
</td></tr></table>
<p style="margin:0 0 20px;color:#666666;font-size:14px;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;">If you didn’t create an OpenBids account, you can safely ignore this email.</p>
</td></tr>
<tr><td style="padding:12px 8px 0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;"><tr><td style="border-top:1px solid #ebebeb;padding-top:20px;color:#666666;font-size:12px;line-height:18px;">OpenBids</td></tr></table>
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
