{
  "name": "Quick Idea / Backlog",
  "description": "Capture a lightweight backlog idea.",
  "title": "[Idea] ",
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use this form to capture an idea in your own words. When you want it implemented, instruct Codex with `Implement #<issue-number>`."
      }
    },
    {
      "type": "textarea",
      "id": "idea",
      "attributes": {
        "label": "Idea",
        "description": "What are you thinking about?",
        "placeholder": "Describe the idea in your own words."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "who",
      "attributes": {
        "label": "Who might this help?",
        "description": "A customer, an administrator, you, or someone else?"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "why",
      "attributes": {
        "label": "Why might it matter?",
        "description": "What could become easier or better?"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Additional context",
        "description": "Optional links or screenshots. Never include passwords, secrets, or private records."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
