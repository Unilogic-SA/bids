{
  "name": "Quick Idea / Backlog",
  "description": "Capture a thought now; you decide when it is ready for Codex.",
  "title": "[Idea] ",
  "labels": [
    "needs-spec"
  ],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Use this form when the idea is still rough. It starts in Needs Spec. When the description is clear enough for you, applying codex-ready authorises Codex even if you did not rewrite it into another template."
      }
    },
    {
      "type": "textarea",
      "id": "idea",
      "attributes": {
        "label": "Idea",
        "description": "What are you thinking about?",
        "placeholder": "Describe the idea in your own words."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "who",
      "attributes": {
        "label": "Who might this help?",
        "description": "A customer, an administrator, you, or someone else?"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "why",
      "attributes": {
        "label": "Why might it matter?",
        "description": "What could become easier or better?"
      },
      "validations": {
        "required": false
      }
    },
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Additional context",
        "description": "Optional links or screenshots. Never include passwords, secrets, or private records."
      },
      "validations": {
        "required": false
      }
    }
  ]
}
