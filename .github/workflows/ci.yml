{
  "name": "CI",
  "on": {
    "pull_request": {
      "branches": [
        "main"
      ]
    },
    "push": {
      "branches": [
        "main",
        "codex/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quality": {
      "name": "Quality",
      "if": "github.repository == 'Unilogic-SA/bids'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "24",
            "cache": "npm"
          }
        },
        {
          "name": "Validate workflow files and automation",
          "run": "node --test .github/scripts/*.test.cjs"
        },
        {
          "name": "Install locked dependencies",
          "run": "npm ci"
        },
        {
          "name": "Test",
          "run": "npm test"
        },
        {
          "name": "Lint",
          "run": "npm run lint"
        },
        {
          "name": "Typecheck",
          "run": "npm run typecheck"
        },
        {
          "name": "Production build",
          "run": "npm run build",
          "env": {
            "NEXT_TELEMETRY_DISABLED": "1"
          }
        }
      ]
    }
  }
}
